name: Streamer
options:
  bundleIdPrefix: uk.ohnotnow
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  Streamer:
    type: application
    platform: macOS
    sources:
      - Sources/Streamer
    dependencies:
      - sdk: iTunesLibrary.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.ohnotnow.streamer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Sources/Streamer/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Streamer
        NSHumanReadableCopyright: ""
        # Without it tccd refuses kTCCServiceMediaLibrary silently, with no prompt, and iTunesLibrary
        # fails with NSCocoaError 4097 on com.apple.amp.library.framework (found 2026-09-26).
        NSAppleMusicUsageDescription: "Streamer reads your Music playlists so it can play one as a stream. It never changes your library."
  StreamerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/StreamerTests
    dependencies:
      - target: Streamer
